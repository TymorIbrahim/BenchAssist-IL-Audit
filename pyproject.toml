[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "benchassist-il-audit"
version = "0.1.0"
description = "Fairness audit framework for BenchAssist-IL, an Israeli judicial decision-support assistant."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "TBD"}

dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.0",
    "python-dotenv>=1.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "google-genai>=1.0",
]

[project.optional-dependencies]
# sentence-transformers powers the reasoning semantic-divergence score in
# rachel_analysis; without it that score is skipped during regeneration.
nlp = [
    "sentence-transformers>=2.2.0",
]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]
